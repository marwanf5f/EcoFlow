D.regions.forEach((r,i)=>h+=`<text class="t rl" data-z="${r.z}" x="${r.x}" y="${r.y}">${r.n}<tspan x="${r.x}" dy="1.2em">${r.ar}</tspan></text>`);
D.markers.forEach((m,i)=>h+=`<g class="mg" data-i="${i}"><circle class="mk" cx="${m.x}" cy="${m.y}" r="3"/><text class="ml" x="${m.x+4}" y="${m.y-3}">${m.n} · ${m.ar}</text></g>`);
const g=document.getElementById("g"),svg=document.getElementById("m"),tip=document.getElementById("tip");
g.innerHTML=h;
let k=1,tx=0,ty=0;
const ap=()=>{g.setAttribute("transform",`translate(${tx} ${ty}) scale(${k})`);svg.style.setProperty("--k",k);
 g.querySelectorAll(".rl").forEach(t=>t.style.display=k>=+t.dataset.z?"":"none");
 g.querySelectorAll(".mg").forEach(t=>{t.style.display=k>=4?"":"none";t.querySelector("text").style.display=k>=8?"":"none"})};
const pt=(x,y)=>{const p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(svg.getScreenCTM().inverse())};
function zoom(f,cx,cy){const n=Math.max(1,Math.min(60,k*f));f=n/k;tx=cx-(cx-tx)*f;ty=cy-(cy-ty)*f;k=n;if(k==1){tx=0;ty=0}ap()}
function zoomTo(x,y,n){k=n;tx=D.W/2-x*n;ty=D.H/2-y*n;ap()}
svg.addEventListener("wheel",e=>{e.preventDefault();const p=pt(e.clientX,e.clientY);zoom(e.deltaY<0?1.25:.8,p.x,p.y)},{passive:false});
document.getElementById("zi").onclick=()=>zoom(1.5,D.W/2,D.H/2);
document.getElementById("zo").onclick=()=>zoom(1/1.5,D.W/2,D.H/2);
document.getElementById("zr").onclick=()=>{k=1;tx=ty=0;ap()};
const ptr=new Map();
svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);svg.style.cursor="grabbing"});
svg.addEventListener("pointerup",e=>{ptr.delete(e.pointerId);svg.style.cursor="grab"});
svg.addEventListener("pointermove",e=>{
 if(ptr.has(e.pointerId)){const o=ptr.get(e.pointerId);
  if(ptr.size==1){const a=pt(o[0],o[1]),b=pt(e.clientX,e.clientY);tx+=b.x-a.x;ty+=b.y-a.y;ap()}
  else{const o2=ptr.get([...ptr.keys()].find(i=>i!=e.pointerId));
   const d0=Math.hypot(o[0]-o2[0],o[1]-o2[1]),d1=Math.hypot(e.clientX-o2[0],e.clientY-o2[1]);
   if(d0>0){const p=pt((e.clientX+o2[0])/2,(e.clientY+o2[1])/2);zoom(d1/d0,p.x,p.y)}
  ptr.set(e.pointerId,[e.clientX,e.clientY]);tip.style.display="none";return}
  ptr.set(e.pointerId,[e.clientX,e.clientY]);tip.style.display="none";return}
 const m=e.target.closest&&e.target.closest("g.mg"),t=e.target.closest&&e.target.closest("path.d");
 let html=null;
 if(m){const q=D.markers[m.dataset.i];html=`<b>${q.n}</b><br>${q.ar}`}
 else if(t){const r=D.regions[t.dataset.i];html=`<b>${r.n} · ${r.ar}</b><br>Value: ${r.v.toLocaleString()} (sample)`}
 if(!html){tip.style.display="none";return}
 const b=svg.parentNode.getBoundingClientRect();tip.style.display="block";tip.style.left=(e.clientX-b.left+12)+"px";tip.style.top=(e.clientY-b.top+12)+"px";tip.innerHTML=html});
svg.addEventListener("pointerleave",()=>tip.style.display="none");
document.getElementById("tk").innerHTML=[100,900,1700,2500,3400].map(v=>`<span>${v.toLocaleString()}</span>`).join("");
document.getElementById("chips").innerHTML=D.markers.map((m,i)=>`<button data-i="${i}">${m.ar} · ${m.n}</button>`).join("");
document.getElementById("chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;const m=D.markers[b.dataset.i];zoomTo(m.x,m.y,25);window.scrollTo({top:0,behavior:"smooth"})};
const T=[["مدينة الشارقة","Sharjah City","West coast","Culture, family, entertainment"],["الحمرية","Al Hamriyah","West coast","Beaches, sea"],["الذيد","Al Dhaid","Central","Heritage, farming, desert"],["المدام","Al Madam","Central","Desert, adventure"],["البطائح","Al Bataeh","Central","Nature, wild landscapes"],["مليحة","Mleiha","Central","Archaeology, desert, geology"],["خورفكان","Khor Fakkan","East coast","Beaches, mountains, adventure"],["كلباء","Kalba","East coast","Reserves, mangroves, beach"],["دبا الحصن","Dibba Al Hisn","East coast","Sea, heritage"]];
document.getElementById("tb").innerHTML="<tr><th>#</th><th>المدينة</th><th>City</th><th>Area</th><th>Tourism</th></tr>"+T.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("");
const I=D.inset;let s=`<svg viewBox="0 0 ${I.W} ${I.H}"><rect width="${I.W}" height="${I.H}" fill="#bfe3f5"/>`;
I.c.forEach(c=>s+=`<path d="${c.d}" fill="#f0ead2" stroke="#a89c70" stroke-width=".8"/>`);
s+=`<path d="${I.uae}" fill="#d8cf9f" stroke="#7a6f40" stroke-width="1" fill-rule="evenodd"/><path d="${I.sh}" fill="#cc5f12" stroke="#4a1d05" stroke-width=".8" fill-rule="evenodd"/>`;
s+=`<rect x="${I.rx}" y="${I.ry}" width="${I.rw}" height="${I.rh}" fill="none" stroke="#c00" stroke-width="1.2"/>`;
const L=[["Saudi Arabia",120,170],["Oman",330,255],["Iran",330,55],["Qatar",40,132],["UAE",250,170],["Persian Gulf",190,70]];
L.forEach(l=>s+=`<text x="${l[1]}" y="${l[2]}" font-size="${l[0]=="UAE"?13:10}" font-weight="${l[0]=="UAE"?800:500}" fill="#444" text-anchor="middle">${l[0]}</text>`);
s+=`<text x="${I.rx+I.rw+4}" y="${I.ry-4}" font-size="10" font-weight="700" fill="#b03a00">Sharjah</text></svg>`;
document.getElementById("ins").innerHTML=s;
ap();
